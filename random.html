<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Drawing — Christy Taylor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
    <a class="site-name" href="index.html">Christy Taylor</a>

    <nav class="site-nav">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
    </nav>
</header>

<main class="random-display">
    <img id="random-drawing" src="" alt="Random drawing by Christy Taylor">

    <button id="another-drawing">Another drawing</button>
</main>

<script src="drawings.js"></script>

<script>
    const image = document.getElementById("random-drawing");
    const button = document.getElementById("another-drawing");

    let previousIndex = -1;

    function showRandomDrawing() {
        let randomIndex;

        do {
            randomIndex = Math.floor(Math.random() * drawings.length);
        } while (randomIndex === previousIndex && drawings.length > 1);

        previousIndex = randomIndex;
        image.src = drawings[randomIndex];
    }

    button.addEventListener("click", showRandomDrawing);

    showRandomDrawing();
</script>

</body>
</html>
