name: WILMACHORD Batch 2 checks
on:
  push:
    branches: [wilmachord-v041-batch2-20261119]
    paths: ['lie013-preview-7x9/**', '.github/wilmachord/**', '.github/workflows/wilmachord-batch2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrument-checks:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            lie013-preview-7x9
            .github/wilmachord
      - name: Align disposable checkout ownership with the container user
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserved sound engine and shared transport
        run: |
          node .github/wilmachord/sound-refinement.test.mjs
          node .github/wilmachord/transport.test.mjs
          node .github/wilmachord/controller.test.mjs
          node .github/wilmachord/audio-regression.test.mjs
          node .github/wilmachord/diagnostic-worklet.test.mjs
          node .github/wilmachord/diagnostic-controller.test.mjs
      - name: Install pinned test API (browsers are preinstalled)
        timeout-minutes: 3
        working-directory: .github/wilmachord
        run: |
          npm install --ignore-scripts --no-audit --no-fund
      - name: Chromium and WebKit at iPhone 13 mini dimensions
        run: node .github/wilmachord/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wilmachord-batch2-test-results
          path: .github/wilmachord/output/
          retention-days: 30
